name: Daily Commit

on:
  schedule:
    - cron: "0 18 * * *"  # adjust time if needed
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Make change
        run: |
          echo "Last updated: $(date)" >> log.txt

      - name: Commit & push
        run: |
          git config --global user.name "danish-2323"
          git config --global user.email "danish-2323@users.noreply.github.com"
          git add .
          git commit -m "auto: update streak" || echo "No changes"
          git push
